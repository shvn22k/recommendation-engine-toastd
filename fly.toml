app = 'recommendation-engine-toastd'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "300s"
  interval = "30s"
  method = "GET"
  timeout = "20s"
  path = "/"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
